{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5 pt-5">
    <div class="col-md-5">
        <div class="card glass-card border-0 shadow-lg p-3">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-primary-soft rounded-circle mb-3" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-user-lock fa-2xl text-primary"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted">Login to access your AI assistant</p>
                </div>
                
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold text-uppercase">Email address</label>
                        <div class="input-group">
                            <span class="input-group-text custom-input-group"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control custom-input" placeholder="you@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold text-uppercase">Password</label>
                        <div class="input-group">
                            <span class="input-group-text custom-input-group"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control custom-input" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 btn-glow fw-bold">Login to Account</button>
                </form>
                <div class="mt-4 text-center">
                    <p class="text-muted small">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
